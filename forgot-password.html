<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password — S.E. Centers</title><meta name="robots" content="noindex"><link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles.css"><script src="src/account.js" defer></script>
</head><body class="account-shell" data-account-page="forgot">
<header class="account-header"><a class="account-brand" href="/">S.E. Centers</a><a href="/login.html">Log In</a></header>
<main class="account-main"><section class="account-card account-card--compact" aria-labelledby="page-title">
  <p class="account-eyebrow">Account Recovery</p><h1 id="page-title">Reset Your Password</h1>
  <p class="account-lede">Enter your email. If it matches an account, we’ll send a single-use reset link.</p>
  <p class="form-status" data-form-status role="status" aria-live="polite" hidden></p>
  <form class="account-form" data-account-form novalidate>
    <label>Email address<input name="email" type="email" autocomplete="email" maxlength="254" required></label>
    <button class="btn btn--solid" type="submit">Send Reset Link</button>
  </form>
  <div class="account-links"><a href="/login.html">Return to login</a></div>
</section></main></body></html>
