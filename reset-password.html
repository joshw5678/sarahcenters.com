<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose New Password — S.E. Centers</title><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles.css"><script src="src/account.js" defer></script>
</head><body class="account-shell" data-account-page="reset">
<header class="account-header"><a class="account-brand" href="/">S.E. Centers</a><a href="/login.html">Log In</a></header>
<main class="account-main"><section class="account-card account-card--compact" aria-labelledby="page-title">
  <p class="account-eyebrow">Account Recovery</p><h1 id="page-title">Choose a New Password</h1>
  <p class="account-lede">Completing this reset signs your account out on every device.</p>
  <p class="form-status" data-form-status role="status" aria-live="polite" hidden></p>
  <form class="account-form" data-account-form novalidate>
    <label>New password<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
    <label>Confirm new password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
    <button class="btn btn--solid" type="submit">Update Password</button>
  </form>
  <div class="account-links" data-after-reset hidden><a class="btn btn--outline-dark" href="/login.html">Log In</a></div>
</section></main></body></html>
